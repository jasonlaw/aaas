# Custom settings merged into Hermes's config.yaml by install.sh (a real
# YAML merge, not a text append). The file stays in place, and reruns are
# idempotent.
#
# Per-key merge behavior is set by a directive, either trailing on the key's
# line or alone on the comment line directly above it:
#   (none)     merge: listed leaves overwrite, siblings Hermes generated are kept
#   @force     replace this key (a dict is replaced as a whole subtree)
#   @default   set only if the key is missing; never clobber a user value
#   @disable   comment this top-level key out of config.yaml
# See README "`.hermes/config.yaml` Bootstrap Directives".
#
# __PLATFORM_DIR__ is replaced by install.sh after sync, with
# ${AAAS_ROOT}/platform (AAAS_ROOT is configurable).

skills:
  external_dirs:
    - __PLATFORM_DIR__/.agents/skills
    - __PLATFORM_DIR__/.hermes/skills

# Mnemosyne is the main memory provider. The built-in MEMORY.md and USER.md
# stay enabled but are capped at 200 characters, so they add almost nothing
# to the system prompt. Disabling the built-in store with memory_enabled:
# false would also be safe: the memory toolset that Mnemosyne's tools use is
# gated separately, by `hermes tools enable/disable memory`, not by this key.
# Do NOT run `hermes tools disable memory` — that kills Mnemosyne tools too.
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 200
  user_char_limit: 200
  provider: mnemosyne

# @default
gateway:
  enabled: true
  platforms:
    telegram:
      enabled: true

# @default
stt:
  provider: local      